<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通用地面预警 · UE 候选 B1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11171f;color:#e6ebf2;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1150px;margin:40px auto;padding:0 28px}small{color:#f77478;letter-spacing:.12em}h1{font-size:30px;margin:12px 0 6px}p{color:#abb7c7;margin:8px 0 20px}.player{background:#090d13;border:1px solid #354050;border-radius:12px;overflow:hidden}canvas{width:100%;display:block;aspect-ratio:1280/800}.controls{display:flex;align-items:center;gap:16px;padding:16px 20px}button{background:#f2646d;border:0;border-radius:7px;padding:10px 20px;font:inherit;font-weight:600;color:#171a20;cursor:pointer}button:disabled{opacity:.4}input{flex:1;accent-color:#f2646d}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}figure{margin:0}figure img{width:100%;border-radius:8px}figcaption{font-size:14px;color:#9faebe}a{color:#accbff}.facts{display:flex;gap:30px;flex-wrap:wrap;font-size:14px;margin:18px 0}b{color:#f4f6fa}footer{font-size:13px;color:#8997a9;margin:24px 0 60px}output{min-width:100px;text-align:right}</style>
<main><small>UE5.7 实际材质帧 · 候选审核 B1</small><h1>通用地面落点预警</h1><p>固定红色外圈、浅色填充、两道向外扩散的波纹。此播放器展示隔离 UE 场景的实际渲染帧。</p>
<div class="facts"><span>实际半径 <b>8 米</b></span><span>单道波纹周期 <b>0.8 秒</b></span><span>演示 <b>出现 → 3 个周期 → 移除</b></span></div>
<div class="player"><canvas width="1280" height="800" aria-label="UE 地面预警动画候选"></canvas><div class="controls"><button id="play" disabled>正在载入</button><input id="seek" type="range" min="0" max="83" value="24" aria-label="预览帧"><output id="time">0.80 / 2.80 s</output></div></div>
<div class="frames"><figure><img src="CandidateB1/frame_010.png" alt="预警刚出现"><figcaption>出现 · 外圈立即固定</figcaption></figure><figure><img src="CandidateB1/frame_024.png" alt="两道波纹扩散"><figcaption>循环 · 波纹到边缘淡出</figcaption></figure><figure><img src="CandidateB1/frame_083.png" alt="预警已移除"><figcaption>结束 · 完整移除</figcaption></figure></div>
<footer>材质：M_GroundWarning_Circle · 样式：DA_GroundWarning_Red · B1 已通过，已接入战争机器 Q 配置。<br><a href="reference.html">查看已通过的参考 A1</a></footer></main>
<script>const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),time=document.querySelector('#time');let frames=[],running=false,start=0;function draw(n){ctx.drawImage(frames[n],0,0);seek.value=n;time.textContent=(n/30).toFixed(2)+' / 2.80 s'}function stop(){running=false;play.textContent='播放 UE 候选'}function tick(t){if(!running)return;let n=Math.floor((t-start)/1000*30);if(n>=84){draw(83);stop();return}draw(n);requestAnimationFrame(tick)}Promise.all(Array.from({length:84},(_,n)=>new Promise((resolve,reject)=>{let i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src='CandidateB1/frame_'+String(n).padStart(3,'0')+'.png'}))).then(images=>{frames=images;draw(24);play.disabled=false;play.textContent='播放 UE 候选'}).catch(()=>play.textContent='帧载入失败');play.onclick=()=>{if(running){stop();return}running=true;play.textContent='暂停';start=performance.now();requestAnimationFrame(tick)};seek.oninput=()=>{if(!frames.length)return;stop();draw(+seek.value)};</script></html>
