<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重防号卡图 · 分层坐标复核</title>
<style>
:root{color-scheme:dark;font:14px system-ui}body{margin:0;background:#171b22;color:#eee}header{padding:16px 24px;position:sticky;top:0;background:#171b22f5;z-index:10;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}button,select{font:inherit;background:#303947;color:#fff;border:1px solid #586577;border-radius:5px;padding:6px 10px}button.active{background:#206073}label{display:flex;gap:8px;align-items:center}main{padding:12px 24px 30px;max-width:1300px;margin:auto}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.frame{position:relative;aspect-ratio:2/3;overflow:hidden;background:repeating-conic-gradient(#2c323d 0% 25%,#353c47 0% 50%) 50%/24px 24px}.frame img{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}.heading{margin:0 0 10px;font-size:16px}.note{color:#b3c0cf;line-height:1.6;margin:14px 0}.guide{display:none;position:absolute;inset:0;z-index:20;background:linear-gradient(90deg,transparent 49.9%,#f78a32 50%,transparent 50.1%),linear-gradient(transparent 49.9%,#f78a32 50%,transparent 50.1%);pointer-events:none}.reference-overlay{z-index:19;opacity:0;pointer-events:none}.badge{position:absolute;bottom:6px;left:6px;background:#111c;padding:4px 7px;z-index:21;font-size:12px}.layer-list{display:flex;gap:10px;flex-wrap:wrap;padding:12px 0}.layer-list label{border:1px solid #485465;padding:6px}.blink .reference-overlay{animation:blink 1.6s steps(1,end) infinite}@keyframes blink{0%,50%{opacity:0}51%,100%{opacity:1}}@media(max-width:750px){.columns{gap:10px}main{padding:10px}header{padding:10px}}
</style>
<header><h1>分层坐标复核</h1><select id="card"><option value="MissilePod">重防导弹仓 · 第二版</option><option value="RainSalvo">雨点攻势 · 第三版</option></select><button id="blink">闪烁比对</button><label>原图叠合 <input id="opacity" type="range" min="0" max="100" value="0"></label><label><input type="checkbox" id="grid">坐标中线</label><label>预览阶段 <select id="stage"><option value="key">独立层 + 移除该层的底图</option><option value="all">六层合成</option></select></label></header>
<main><p class="note">左右使用同一个 1024 × 1536 坐标系，所有层的缩放和偏移均一致。右侧直接显示生成文件，没有逐层补偿位移。该页面用于复核；不代表 UE 最终画面或美术验收。</p><div class="columns"><section><h2 class="heading">已通过的参考图</h2><div class="frame"><img id="original" alt="已通过参考图"><div class="guide"></div><span class="badge">参考图</span></div></section><section><h2 class="heading">拆层后原位叠合</h2><div class="frame" id="composite"><img class="reference-overlay" id="overlay" alt="叠合参考"><div class="guide"></div><span class="badge" id="status">独立层复核</span></div></section></div><div class="layer-list" id="layers"></div><p class="note" id="description"></p></main>
<script>
const $=id=>document.getElementById(id);const definitions={MissilePod:{source:'../Review_v2/MissilePod.png',label:'机械臂',layers:[6,5,4,3,2],description:'第二层：三只机械臂、夹持钢板、焊接光和扫描光。主体导弹仓与工装台位于第三层；第一层保留为空。'},RainSalvo:{source:'../Review_v3/RainSalvo.png',label:'蓝色 +1 导弹',layers:[6,5,4,3,2,1],description:'第二层：右侧蓝色半透明导弹、绿色 +1 及其出射尾焰。左侧刚出仓导弹与两个导弹仓位于第三层。'}};let refresh=0;
function render(){const current=++refresh;const key=$('card').value,d=definitions[key];$('original').src=d.source;$('overlay').src=d.source;$('description').textContent=d.description;document.querySelectorAll('.production-layer').forEach(x=>x.remove());$('layers').replaceChildren();const layers=$('stage').value==='key'?['Remaining',2]:d.layers;layers.forEach(layer=>{const img=document.createElement('img');img.className='production-layer';img.src=key+'_'+layer+'.png';img.alt='图层 '+layer;img.style.zIndex=layer==='Remaining'?'0':String(layer===1?3:layer===3?4:layer===2?5:7-Number(layer));img.onerror=()=>{if(current===refresh)$('status').textContent='图层尚未齐备，请勿据此验收';};$('composite').prepend(img);const label=document.createElement('label');const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=true;toggle.onchange=()=>img.style.visibility=toggle.checked?'visible':'hidden';label.append(toggle,layer==='Remaining'?'补全底图':'第 '+layer+' 层');$('layers').append(label);});$('status').textContent=$('stage').value==='key'?'独立层原位叠合':'六层原位叠合';}
$('card').onchange=render;$('stage').onchange=render;$('opacity').oninput=()=>{$('composite').classList.remove('blink');$('blink').classList.remove('active');$('overlay').style.opacity=$('opacity').value/100;};$('blink').onclick=()=>{$('composite').classList.toggle('blink');$('blink').classList.toggle('active');};$('grid').onchange=()=>document.querySelectorAll('.guide').forEach(x=>x.style.display=$('grid').checked?'block':'none');render();
</script></html>
