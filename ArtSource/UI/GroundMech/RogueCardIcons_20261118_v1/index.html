<script>
for(const article of document.querySelectorAll('article'))article.dataset.file=article.querySelector('img').getAttribute('src').split('/').pop().split('?')[0];
const axisButtons=document.querySelectorAll('[data-before]');
function setVersion(version){
 for(const article of document.querySelectorAll('article')){
  const path=(version==='v1'?'Revisions/v1/Icons/':'Icons/')+article.dataset.file+'?v=20261118-'+version+'-1-package-axis';
  article.querySelector('img').src=path;article.querySelector('a[download]').href=path;
 }
 for(const button of document.querySelectorAll('[data-version]'))button.setAttribute('aria-pressed',String(button.dataset.version===version));
 document.querySelector('#revision-name').textContent=version==='v1'?'原版 V1':'新版 V2.1 · 三枚导弹轴线修订';
 for(const axisButton of axisButtons){axisButton.disabled=version==='v1';axisButton.setAttribute('aria-pressed','false');axisButton.textContent='查看轴线修订前'}
}
for(const button of document.querySelectorAll('[data-version]'))button.addEventListener('click',()=>setVersion(button.dataset.version));
for(const axisButton of axisButtons)axisButton.addEventListener('click',()=>{
 const before=axisButton.getAttribute('aria-pressed')!=='true';
 const card=axisButton.closest('article');
 const path=before?axisButton.dataset.before:'Icons/'+card.dataset.file+'?v=20261118-v2-1-package-axis';
 card.querySelector('img').src=path;card.querySelector('a[download]').href=path;
 axisButton.setAttribute('aria-pressed',String(before));axisButton.textContent=before?'返回轴线修订后':'查看轴线修订前';
});
for(const button of document.querySelectorAll('[data-bg]'))button.addEventListener('click',()=>{document.documentElement.style.setProperty('--tile',button.dataset.bg);for(const other of document.querySelectorAll('[data-bg]'))other.setAttribute('aria-pressed',String(other===button))});
for(const button of document.querySelectorAll('[data-size]'))button.addEventListener('click',()=>{document.documentElement.style.setProperty('--icon-size',button.dataset.size+'px');for(const other of document.querySelectorAll('[data-size]'))other.setAttribute('aria-pressed',String(other===button))});
</script>
