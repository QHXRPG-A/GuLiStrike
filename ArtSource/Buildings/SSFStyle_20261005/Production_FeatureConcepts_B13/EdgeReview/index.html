<script>
(() => {
  const data = JSON.parse(document.getElementById("review-data").textContent);
  const byId = id => document.getElementById(id);
  const building = byId("building");
  const stroke = byId("stroke");
  const missing = byId("missing");
  const marks = byId("marks");
  const topology = byId("topology");
  const source = byId("source");
  const target = byId("target");
  const cache = new Map();
  let paths = [];
  let generation = 0;

  function loadImage(path) {
    if (!cache.has(path)) {
      cache.set(path, new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = path;
      }));
    }
    return cache.get(path);
  }

  function replaceOptions(select, options) {
    select.replaceChildren(...options.map(({text, value}) => new Option(text, value)));
  }

  function imageCrop(points, limits, ratio, minimumWidth) {
    const xs = points.map(p => p[0]);
    const ys = points.map(p => p[1]);
    const left = Math.min(...xs), right = Math.max(...xs);
    const top = Math.min(...ys), bottom = Math.max(...ys);
    const width = Math.min(limits[0], limits[1] * ratio,
      Math.max(minimumWidth, (right - left) * 1.55, (bottom - top) * 1.55 * ratio));
    const height = width / ratio;
    const clamp = (value, max) => Math.max(0, Math.min(value, max));
    return [clamp((left + right - width) / 2, limits[0] - width),
      clamp((top + bottom - height) / 2, limits[1] - height), width, height];
  }

  function draw(canvas, image, size, limits, lines, color, dashed, minimumWidth, mesh) {
    const context = canvas.getContext("2d");
    const [x, y, w, h] = imageCrop(lines.flat(), limits, canvas.width / canvas.height, minimumWidth);
    context.clearRect(0, 0, canvas.width, canvas.height);
    const sx = image.naturalWidth / size[0];
    const sy = image.naturalHeight / size[1];
    context.drawImage(image, x * sx, y * sy, w * sx, h * sy, 0, 0, canvas.width, canvas.height);
    function paint(segments, tint, width, dash, outline) {
      context.save();
      context.lineJoin = "round";
      context.lineCap = "round";
      context.setLineDash(dash);
      for (const line of segments) {
        context.beginPath();
        line.forEach(([a, b], i) => {
          const px = (a - x) * canvas.width / w;
          const py = (b - y) * canvas.height / h;
          if (i === 0) context.moveTo(px, py);
          else context.lineTo(px, py);
        });
        if (outline) {
          context.lineWidth = width + 3;
          context.strokeStyle = "#15191dcc";
          context.stroke();
        }
        context.lineWidth = width;
        context.strokeStyle = tint;
        context.stroke();
      }
      context.restore();
    }
    if (mesh && topology.checked) {
      paint(mesh.smooth, "#56616f85", 1, [], false);
      paint(mesh.folds, "#a879e5e6", 2, [], false);
    }
    if (marks.checked) paint(lines, color, 3, dashed ? [10, 7] : [], true);
  }

  async function update() {
    const run = ++generation;
    const model = data[Number(building.value)];
    const index = Number(stroke.value);
    const path = paths[index];
    byId("previous").disabled = index <= 0;
    byId("next").disabled = index >= paths.length - 1;
    topology.disabled = !path.topology;
    byId("topologyLegend").hidden = !(topology.checked && path.topology);
    byId("modelLegend").textContent = path.matched ? "青线 · 对应原边" : "虚线 · 参考估算位置";
    byId("result").textContent = path.matched ? "有对应原边。" : "该笔待确认原边。";
    byId("note").textContent = path.note ? " " + path.note : "";
    try {
      const [refImage, modelImage] = await Promise.all([
        loadImage("../../References_FeatureConcepts_A5/" + model.reference),
        loadImage(model.model_image)
      ]);
      if (run !== generation) return;
      draw(source, refImage, model.reference_size,
        [model.reference_size[0] / 2, model.reference_size[1]], [path.source], "#ffd166", false, 220);
      draw(target, modelImage, model.model_size, model.model_size,
        path.matched ? path.segments : [path.guide], "#78e7ff", !path.matched, 110, path.topology);
    } catch {
      if (run === generation) byId("note").textContent = " 对照图读取失败，请从工程目录打开本页。";
    }
  }

  function loadStrokes() {
    const model = data[Number(building.value)];
    paths = model.paths.filter(path => !missing.checked || !path.matched);
    replaceOptions(stroke, paths.map((p, i) => ({text: p.group + " · 第 " + p.number + " 笔", value: i})));
    update();
  }

  function loadBuildings() {
    const previous = building.value;
    replaceOptions(building, data.flatMap((model, index) => {
      const included = !missing.checked || model.paths.some(path => !path.matched);
      return included ? [{text: model.name, value: index}] : [];
    }));
    if ([...building.options].some(option => option.value === previous)) building.value = previous;
    loadStrokes();
  }

  byId("previous").addEventListener("click", () => { stroke.selectedIndex--; update(); });
  byId("next").addEventListener("click", () => { stroke.selectedIndex++; update(); });
  building.addEventListener("change", loadStrokes);
  stroke.addEventListener("change", update);
  marks.addEventListener("change", update);
  topology.addEventListener("change", update);
  missing.addEventListener("change", loadBuildings);
  loadBuildings();
})();
</script>
</body>
</html>
